<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1d13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lundstulen">
<meta name="description" content="Posttrekning for Lundstulen jaktlag – trekk tilfeldig hvem som får hvilken post.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" as="image" href="img/elg-1000.jpg" media="(max-width:1000px)">
<link rel="preload" as="image" href="img/elg.jpg" media="(min-width:1001px)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Lundstulen jaktlag – posttrekning</title>
<style>
:root{
 --night:#1b1d13;      /* myr i skumring */
 --moss:#2e3a22;
 --birch:#e8b43c;      /* bjørkeløv */
 --lyng:#c2462b;       /* tyttebærlyng */
 --blaze:#ff6a17;      /* signaloransje */
 --snow:#f5eddc;
 --muted:#c9bfa8;
 --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
 --body:'Barlow',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100svh;font:400 17px/1.5 var(--body);color:var(--snow);-webkit-font-smoothing:antialiased}

/* Bakgrunnsbilde */
.bg{position:fixed;inset:0;z-index:-1;background:var(--night) url(img/elg-1000.jpg) 68% 0/auto max(66svh,calc(100vw/1.5)) no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(27,29,19,.7) 0%,rgba(27,29,19,.45) 20%,rgba(27,29,19,.05) 34%,rgba(27,29,19,.1) 42%,rgba(27,29,19,.85) 60%,var(--night) 67%)}
@media (min-width:1001px){.bg{left:22vw;background-image:url(img/elg.jpg);background-position:62% 40%;background-size:cover}
 .bg::after{background:linear-gradient(90deg,var(--night) 0%,rgba(27,29,19,.7) 18%,rgba(27,29,19,.08) 45%,rgba(27,29,19,.2) 100%)}}

.app{min-height:100svh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto;
 padding:max(20px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
@media (min-width:700px){.app{padding-left:40px;padding-right:40px}}

/* Tittel */
header{margin-top:6px}
h1{font:900 clamp(52px,15vw,104px)/.84 var(--display);margin:0;letter-spacing:-.01em;text-transform:none;
 text-shadow:0 2px 24px rgba(0,0,0,.45)}
h1 span{display:block;color:var(--birch)}
.eyebrow{margin:0 0 8px;font:700 14px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--blaze);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.sub{margin:14px 0 0;max-width:30ch;color:var(--snow);font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.6)}

main{margin-top:auto;padding-top:28px;width:100%;max-width:500px}

.panel{background:rgba(27,29,19,.72);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
 border:1px solid rgba(245,237,220,.12);border-radius:22px;padding:20px}
.panel h2{font:700 30px/1 var(--display);margin:0 0 4px;letter-spacing:.01em}
.hint{margin:0 0 12px;color:var(--muted);font-size:15px}
.hidden{display:none!important}

textarea{display:block;width:100%;min-height:200px;resize:vertical;border-radius:14px;padding:12px 14px;
 font:500 18px/1.6 var(--body);color:var(--snow);background:rgba(0,0,0,.28);border:1px solid rgba(245,237,220,.18)}
textarea::placeholder{color:rgba(245,237,220,.35)}
textarea:focus{outline:2px solid var(--birch);outline-offset:2px;border-color:transparent}
.count{margin:10px 2px 0;color:var(--muted);font-size:15px}
.count b{color:var(--snow);font-weight:700}

button{display:block;width:100%;margin-top:12px;padding:16px 18px;border-radius:14px;border:0;cursor:pointer;
 font:700 18px/1 var(--body);color:var(--night);background:var(--blaze);transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:scale(.985)}
button:focus-visible{outline:3px solid var(--birch);outline-offset:3px}
button:disabled{opacity:.45;cursor:default;transform:none;filter:none}
button.ghost{background:transparent;color:var(--snow);border:1.5px solid rgba(245,237,220,.35)}
.row{display:flex;gap:10px}.row button{flex:1}

/* Trekning: post-skiltet */
.tag{position:relative;margin:6px 0 4px;padding:30px 18px 26px;text-align:center;color:var(--night);background:var(--blaze);
 clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px);
 box-shadow:inset 0 0 0 3px rgba(27,29,19,.18)}
.tag::before{content:"";position:absolute;top:12px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--night);opacity:.85}
.tag-no{font:700 15px/1 var(--body);letter-spacing:.04em;opacity:.75;margin-top:6px}
.tag-name{font:900 clamp(40px,13vw,68px)/1 var(--display);margin-top:10px;min-height:1em;overflow-wrap:anywhere}
.tag.rolling .tag-name{filter:blur(.6px);opacity:.8}
.tag.landed{animation:land .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(.94) rotate(-1.5deg)}100%{transform:none}}
.left{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}

/* Liste */
ol.list{list-style:none;margin:16px 0 0;padding:0;counter-reset:n}
ol.list li{counter-increment:n;display:flex;align-items:baseline;gap:14px;padding:9px 2px;border-top:1px solid rgba(245,237,220,.1);font-size:18px;font-weight:600}
ol.list li::before{content:counter(n);flex:0 0 2ch;text-align:right;font:900 24px/1 var(--display);color:var(--birch)}
ol.list li:last-child{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.status{min-height:1.5em;margin-top:10px;text-align:center;color:var(--birch);font-size:15px}


@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app">
<header>
 <p class="eyebrow">Posttrekning</p>
 <h1>Lundstulen <span>jaktlag</span></h1>
 <p class="sub">Trekk hvem som skal sitte på hvilken post. Ingen blir trukket to ganger.</p>
</header>

<main>
 <section class="panel" id="inputCard">
  <h2>Hvem er med i dag?</h2>
  <p class="hint">Skriv én jeger per linje. Navnene huskes til neste gang.</p>
  <textarea id="names" aria-label="Jegere, én per linje" spellcheck="false" autocomplete="off" placeholder="Ola Nordmann&#10;Per Hansen&#10;Kari Olsen"></textarea>
  <div class="count" id="count"></div>
  <button onclick="start()">Klar til trekning</button>
 </section>

 <section class="panel hidden" id="drawCard" aria-live="polite">
  <div class="tag" id="tag">
   <div class="tag-no" id="tagNo">Hvem får post 1?</div>
   <div class="tag-name" id="drawn">?</div>
  </div>
  <div class="left" id="left"></div>
  <button onclick="drawNext()" id="drawBtn">Start</button>
  <ol class="list" id="results"></ol>
  <div id="doneBox" class="hidden">
   <button onclick="copyResults()">Kopier resultat</button>
   <div class="status" id="copyStatus"></div>
  </div>
  <div class="row">
   <button class="ghost" onclick="start()" id="againBtn">Trekk på nytt</button>
   <button class="ghost" onclick="resetAll()">Endre navn</button>
  </div>
 </section>
</main>

</div>

<script>
let remaining=[],results=[],rolling=false;
const $=id=>document.getElementById(id);
const namesEl=$('names');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{namesEl.value=localStorage.getItem('jegere')||''}catch(e){}
namesEl.addEventListener('input',()=>{updateCount();try{localStorage.setItem('jegere',namesEl.value)}catch(e){}});
function getNames(){return [...new Set(namesEl.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))]}
function updateCount(){let n=getNames().length;$('count').innerHTML=n?'<b>'+n+'</b> jeger'+(n===1?'':'e')+' klar'+(n===1?'':'e'):'Ingen jegere ennå'}
function rand(n){return crypto.getRandomValues(new Uint32Array(1))[0]%n}
function start(){
 remaining=getNames();results=[];
 if(!remaining.length){namesEl.focus();$('count').textContent='Skriv inn minst ett navn for å starte.';return}
 $('inputCard').classList.add('hidden');
 $('drawCard').classList.remove('hidden');
 $('doneBox').classList.add('hidden');
 $('drawBtn').classList.remove('hidden');
 $('drawBtn').disabled=false;
 $('drawBtn').textContent='Start';
 $('tagNo').textContent='Hvem får post 1?';
 $('drawn').textContent='?';
 $('copyStatus').textContent='';
 render();updateLeft();
 window.scrollTo({top:document.body.scrollHeight,behavior:reduceMotion?'auto':'smooth'});
}
function drawNext(){
 if(!remaining.length||rolling)return;
 const name=remaining.splice(rand(remaining.length),1)[0];
 const pool=remaining.length?[...remaining,name]:[name];
 const tag=$('tag'),drawn=$('drawn'),btn=$('drawBtn');
 btn.textContent='Trekk neste';
 $('tagNo').textContent='Post '+(results.length+1);
 const land=()=>{
  rolling=false;tag.classList.remove('rolling');drawn.textContent=name;
  tag.classList.remove('landed');void tag.offsetWidth;tag.classList.add('landed');
  if(navigator.vibrate)navigator.vibrate(40);
  results.push(name);render();updateLeft();
  if(!remaining.length){btn.classList.add('hidden');$('doneBox').classList.remove('hidden')}
  else btn.disabled=false;
 };
 if(reduceMotion||pool.length<2){land();return}
 rolling=true;btn.disabled=true;tag.classList.add('rolling');
 let t=0,delay=45;
 (function spin(){
  drawn.textContent=pool[t++%pool.length];
  delay*=1.13;
  if(delay>260)setTimeout(land,delay);else setTimeout(spin,delay);
 })();
}
function updateLeft(){const n=remaining.length;$('left').textContent=n?n+' igjen i hatten':'Alle er trukket'}
function render(){$('results').innerHTML=results.map(n=>'<li>'+escapeHtml(n)+'</li>').join('')}
async function copyResults(){
 const text='Lundstulen jaktlag – posttrekning\n\n'+results.map((n,i)=>'Post '+(i+1)+': '+n).join('\n');
 try{await navigator.clipboard.writeText(text);$('copyStatus').textContent='Resultatet er kopiert.'}
 catch(e){prompt('Kopier resultatet:',text)}
}
function resetAll(){
 remaining=[];results=[];
 $('drawCard').classList.add('hidden');
 $('inputCard').classList.remove('hidden');
 namesEl.focus();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
updateCount();
</script>
</body>
</html>
